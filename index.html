<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efd2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120d2b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Himbo-Mode – the 8-bit workout tracker. Log sets, earn XP, level up." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Himbo-Mode" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Himbo-Mode</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('himbo-prefs') || '{}').state || {};
        var t = p.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (p.lang) document.documentElement.lang = p.lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
